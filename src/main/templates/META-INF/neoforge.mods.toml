license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="HacklesCackles"
description='''
A spooky supplement to your Minecraft experience! Adds abandoned structures, tower dungeons, creature dens, and more!
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[5.5,)"
ordering="NONE"
side="BOTH"

# JEI is optional: recipes and info pages show up when it's installed.
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[30,)"
ordering="NONE"
side="CLIENT"

[[mixins]]
config="${mod_id}.mixins.json"